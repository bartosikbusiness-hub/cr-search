<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Premodern – Kolo štěstí</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg      : #0f0f17;
      --panel   : #18182a;
      --border  : #2e2e50;
      --glow    : #5e4ec0;
      --text    : #dcdcf0;
      --muted   : #7878a8;
      --purple  : #a060f0;
      --red     : #f04f5e;
      --radius  : 8px;
    }

    body {
      background  : var(--bg);
      color       : var(--text);
      font-family : 'Segoe UI', system-ui, sans-serif;
      min-height  : 100vh;
      display     : flex;
      flex-direction: column;
      align-items : center;
      padding     : 2rem 1rem 4rem;
      gap         : 1.5rem;
    }

    /* ── Header ── */
    header {
      width      : 100%;
      max-width  : 800px;
      display    : flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap  : wrap;
      gap        : .6rem;
    }

    h1 {
      font-size   : 1.6rem;
      font-weight : 700;
      background  : linear-gradient(90deg, #a060f0, #4fa6f0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-decoration: none;
    }

    .nav-link {
      background   : var(--panel);
      border       : 1px solid var(--border);
      border-radius: var(--radius);
      color        : var(--text);
      font         : inherit;
      font-size    : .88rem;
      padding      : .45rem 1rem;
      cursor       : pointer;
      text-decoration: none;
      transition   : border-color .15s;
    }
    .nav-link:hover { border-color: var(--glow); }

    /* ── Wheel container ── */
    .wheel-wrap {
      position: relative;
      width   : 660px;
      height  : 660px;
    }

    #wheel {
      display: block;
    }

    /* Pointer – red triangle at top center */
    .pointer {
      position     : absolute;
      top          : -6px;
      left         : 50%;
      transform    : translateX(-50%);
      width        : 0;
      height       : 0;
      border-left  : 12px solid transparent;
      border-right : 12px solid transparent;
      border-top   : 28px solid var(--red);
      filter       : drop-shadow(0 0 6px var(--red));
      z-index      : 10;
    }

    /* ── Spin button ── */
    button#spin {
      background   : var(--purple);
      border       : none;
      border-radius: var(--radius);
      color        : #fff;
      font         : inherit;
      font-size    : 1.1rem;
      font-weight  : 700;
      padding      : .75rem 3rem;
      cursor       : pointer;
      transition   : background .15s, transform .1s;
      letter-spacing: .05em;
    }
    button#spin:hover:not(:disabled)  { background: #8040d8; }
    button#spin:active:not(:disabled) { transform: scale(.97); }
    button#spin:disabled { opacity: .45; cursor: not-allowed; }

    /* ── Result ── */
    #result {
      min-height  : 90px;
      display     : flex;
      flex-direction: column;
      align-items : center;
      gap         : .4rem;
      text-align  : center;
    }

    #result .label {
      font-size  : .78rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color      : var(--muted);
    }

    #result .winner {
      font-size  : 2rem;
      font-weight: 800;
      background : linear-gradient(90deg, #a060f0, #4fa6f0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      opacity    : 0;
      transform  : scale(.8);
      transition : opacity .4s ease, transform .4s ease;
    }
    #result .winner.show {
      opacity  : 1;
      transform: scale(1);
    }
  </style>
</head>
<body>

  <header>
    <a href="/" style="text-decoration:none">
      <h1>Premodern</h1>
    </a>
    <a href="/"            class="nav-link">🔍 Vyhledávání</a>
    <a href="/proc-ja.html" class="nav-link">😤 Kolo neštěstí</a>
  </header>

  <div class="wheel-wrap">
    <div class="pointer"></div>
    <canvas id="wheel" width="660" height="660"></canvas>
  </div>

  <button id="spin">Zatočit!</button>

  <div id="result">
    <div class="label" id="result-label"></div>
    <div class="winner" id="result-winner"></div>
  </div>

  <script>
    const ARCHETYPES = [
      '4c Control','Aluren','Angry Ghoul','Angry Hermit','Astral Slide',
      'Balancing Tings','Battle of Wits','Broccoli Soup','Burn','BW Control',
      'Cephalid Breakfast','Clerics','Contamination','Dance Academy','Deadguy Ale',
      'Devourer Combo','Doomsday','Draco Blast','Dragonstorm','Drake Combo',
      'Dream Halls','Dredgeless Dredge','Elves','Enchantress','False Cure',
      'Fires','Fluctuator','Frenetic Encounter','Full English Breakfast','Gamekeeper',
      'Goblins','Great combo','Gro-A-Tog','Iggy Pop','Lands',
      'Landstill','Life','Machine Head','Madness','Madness Tribe',
      'Merfolks','Mono Black','Mono Black Control','Mono Blue','Mono Green',
      'Mr T','MUD','Nic Fit','Oath','Oath Ponza',
      'Oath Spec','Pandeburst','Parallax Replenish','Parfait','Pattern Combo',
      'Pebbles','Pink Prison','Pit Rack','Ponza','Pox',
      'Psychatog','Pyrostatic Oath','Reanimator','Rebels','Red Control',
      'Rogue','Slivers','Sneak Attack','Stasis','Stiflenought',
      'Storm','Survival - Other','Survival Infestation','Survival Recurring','Survival Tradewind',
      'Survival Welder','Tax Rack Aggro','Terrageddon','The Rock','The Solution',
      'Threshold','Tide Control','Tide UW','Tireless Tribe','Tribal',
      'Trinity','Trix','Tron','Turbo Lands','Turtle Splash',
      'UBG Control','UR Control','UW Control','UW Midrange','UWB Control',
      'UWG Control','Wake Control','White Control','White Weenie','Zombie Infestation',
      'Zombies','Zoo',
    ];

    const PALETTE = [
      '#5e4ec0','#4fa6f0','#a060f0','#2a7fd4','#7040b8',
      '#3a9ee0','#6a50d0','#3888c8','#8858e0','#2e7abc',
      '#9060f0','#4494d8','#7048c8','#50a0f0','#6040b0',
    ];

    const canvas  = document.getElementById('wheel');
    const ctx     = canvas.getContext('2d');
    const SIZE    = 660;
    const CENTER  = SIZE / 2;
    const RADIUS  = CENTER - 16;
    const N       = ARCHETYPES.length;
    const SLICE   = (2 * Math.PI) / N;

    let currentAngle = -Math.PI / 2; // start so section 0 is at top
    let spinning     = false;

    function drawWheel(rotation) {
      ctx.clearRect(0, 0, SIZE, SIZE);

      // Shadow / glow behind wheel
      ctx.save();
      ctx.shadowColor = '#5e4ec055';
      ctx.shadowBlur  = 30;
      ctx.beginPath();
      ctx.arc(CENTER, CENTER, RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = '#18182a';
      ctx.fill();
      ctx.restore();

      for (let i = 0; i < N; i++) {
        const startAngle = rotation + i * SLICE;
        const endAngle   = startAngle + SLICE;

        // Section fill
        ctx.beginPath();
        ctx.moveTo(CENTER, CENTER);
        ctx.arc(CENTER, CENTER, RADIUS, startAngle, endAngle);
        ctx.closePath();
        ctx.fillStyle = PALETTE[i % PALETTE.length];
        ctx.fill();

        // Section border
        ctx.strokeStyle = '#0f0f17';
        ctx.lineWidth   = 1;
        ctx.stroke();

        // Text
        ctx.save();
        ctx.translate(CENTER, CENTER);
        ctx.rotate(startAngle + SLICE / 2);
        ctx.textAlign    = 'right';
        ctx.textBaseline = 'middle';
        ctx.fillStyle    = 'rgba(255,255,255,0.92)';
        ctx.font         = 'bold 9px Segoe UI, system-ui, sans-serif';
        ctx.fillText(ARCHETYPES[i], RADIUS - 8, 0);
        ctx.restore();
      }

      // Center circle
      ctx.beginPath();
      ctx.arc(CENTER, CENTER, 22, 0, Math.PI * 2);
      ctx.fillStyle = '#0f0f17';
      ctx.fill();
      ctx.strokeStyle = '#5e4ec0';
      ctx.lineWidth   = 2;
      ctx.stroke();

      // Center dot
      ctx.beginPath();
      ctx.arc(CENTER, CENTER, 7, 0, Math.PI * 2);
      ctx.fillStyle = '#a060f0';
      ctx.fill();
    }

    function getWinner(angle) {
      // Pointer at top = -π/2
      const pointerAngle = -Math.PI / 2;
      const adjusted     = ((pointerAngle - angle) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
      return Math.floor(adjusted / SLICE) % N;
    }

    function showWinner(name) {
      document.getElementById('result-label').textContent  = 'Hraješ';
      const el = document.getElementById('result-winner');
      el.textContent = name;
      el.classList.remove('show');
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
    }

    function easeOut(t) {
      return 1 - Math.pow(1 - t, 4);
    }

    document.getElementById('spin').addEventListener('click', () => {
      if (spinning) return;
      spinning = true;

      document.getElementById('spin').disabled = true;
      document.getElementById('result-label').textContent  = '';
      const el = document.getElementById('result-winner');
      el.classList.remove('show');

      const extraRotations = 6 + Math.random() * 4;          // 6–10 otáček
      const spinAmount     = extraRotations * 2 * Math.PI;
      const duration       = 7000;
      const startTime      = performance.now();
      const startAngle     = currentAngle;

      function animate(now) {
        const elapsed = now - startTime;
        const t       = Math.min(elapsed / duration, 1);
        currentAngle  = startAngle + spinAmount * easeOut(t);
        drawWheel(currentAngle);

        if (t < 1) {
          requestAnimationFrame(animate);
        } else {
          spinning = false;
          document.getElementById('spin').disabled = false;
          showWinner(ARCHETYPES[getWinner(currentAngle)]);
        }
      }

      requestAnimationFrame(animate);
    });

    // Initial draw
    drawWheel(currentAngle);
  </script>
</body>
</html>
