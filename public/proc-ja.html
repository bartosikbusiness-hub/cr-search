<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Premodern – Proč já?</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg      : #0f0f17;
      --panel   : #18182a;
      --border  : #2e2e50;
      --glow    : #5e4ec0;
      --text    : #dcdcf0;
      --muted   : #7878a8;
      --purple  : #a060f0;
      --red     : #f04f5e;
      --radius  : 8px;
    }

    body {
      background  : var(--bg);
      color       : var(--text);
      font-family : 'Segoe UI', system-ui, sans-serif;
      min-height  : 100vh;
      display     : flex;
      flex-direction: column;
      align-items : center;
      padding     : 2rem 1rem 4rem;
      gap         : 1.5rem;
    }

    header {
      width      : 100%;
      max-width  : 800px;
      display    : flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap  : wrap;
      gap        : .6rem;
    }

    h1 {
      font-size   : 1.6rem;
      font-weight : 700;
      background  : linear-gradient(90deg, #a060f0, #4fa6f0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav-link {
      background   : var(--panel);
      border       : 1px solid var(--border);
      border-radius: var(--radius);
      color        : var(--text);
      font         : inherit;
      font-size    : .88rem;
      padding      : .45rem 1rem;
      cursor       : pointer;
      text-decoration: none;
      transition   : border-color .15s;
    }
    .nav-link:hover { border-color: var(--glow); }

    .wheel-wrap {
      position: relative;
      width   : 660px;
      height  : 660px;
    }

    #wheel { display: block; }

    .pointer {
      position     : absolute;
      top          : -6px;
      left         : 50%;
      transform    : translateX(-50%);
      width        : 0;
      height       : 0;
      border-left  : 12px solid transparent;
      border-right : 12px solid transparent;
      border-top   : 28px solid var(--red);
      filter       : drop-shadow(0 0 6px var(--red));
      z-index      : 10;
    }

    button#spin {
      background   : #b03040;
      border       : none;
      border-radius: var(--radius);
      color        : #fff;
      font         : inherit;
      font-size    : 1.1rem;
      font-weight  : 700;
      padding      : .75rem 3rem;
      cursor       : pointer;
      transition   : background .15s, transform .1s;
      letter-spacing: .05em;
    }
    button#spin:hover:not(:disabled)  { background: var(--red); }
    button#spin:active:not(:disabled) { transform: scale(.97); }
    button#spin:disabled { opacity: .45; cursor: not-allowed; }

    #result {
      min-height  : 110px;
      max-width   : 700px;
      display     : flex;
      flex-direction: column;
      align-items : center;
      gap         : .5rem;
      text-align  : center;
      padding     : 0 1rem;
    }

    #result .label {
      font-size  : .78rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color      : var(--muted);
    }

    #result .winner {
      font-size  : 1.45rem;
      font-weight: 800;
      line-height: 1.3;
      color      : var(--red);
      opacity    : 0;
      transform  : scale(.8);
      transition : opacity .4s ease, transform .4s ease;
    }
    #result .winner.show {
      opacity  : 1;
      transform: scale(1);
    }
  </style>
</head>
<body>

  <header>
    <a href="/" style="text-decoration:none"><h1>Premodern</h1></a>
    <div style="display:flex;gap:.4rem;flex-wrap:wrap">
      <a href="/"          class="nav-link">🔍 Vyhledávání</a>
      <a href="/wheel.html" class="nav-link">🎡 Kolo štěstí</a>

    </div>
  </header>

  <div class="wheel-wrap">
    <div class="pointer"></div>
    <canvas id="wheel" width="660" height="660"></canvas>
  </div>

  <button id="spin">Chci vědět pravdu</button>

  <div id="result">
    <div class="label" id="result-label"></div>
    <div class="winner" id="result-winner"></div>
  </div>

  <script>
    const REASONS = [
      'Kurva, zase mana screw',
      'Soupeř měl topdecked přesně tu jednu kartu co mě zabíjí, do prdele',
      'Byl jsem na mulliganu na 5 a dostal jsem hovno',
      'Vytopdeckoval jsem 5 zemí za sebou, to není náhoda to je osobní',
      'Zapomněl jsem zaplatit upkeep, jsem debil',
      'Soupeř měl sideboard přesně na můj deck, někdo mu řekl co hraju',
      'Chyběla mi jedna kurva mana',
      'Prohrávám vždy když si koupím nový deck, zákon světa',
      'Moje kostky jsou prokleté, potřebuju nové',
      'Seděl jsem pod ventilátorem a karty mi fouklo',
      'Měl jsem ruku plnou counterspellů ale soupeř nehrál nic',
      'Scryfall říkal 70% výhra, prohrál jsem, Scryfall lže',
      'Soupeř měl 3× Force of Will v ruce po celou dobu',
      'Deck byl blbě zamíchaný, příště zamíchám jinak',
      'Koupil jsem si karty den před tím než zdražily, klasika',
      'Nafta je drahá a to mě rozhodilo',
      'Nemohl jsem spát kvůli sousedovi co kouřil ve 2 ráno',
      'Vláda mi bere tolik daní že nemám na lepší karty',
      'Soupeř měl štěstí začátečníka, hrál první turnaj v životě',
      'Měl jsem flood ve všech 3 hrách, to je statisticky nemožné',
      'Zapomněl jsem doma svůj lucky token',
      'Soupeř se 5× za sebou bránil Force of Willem, to není fair',
      'Elektřina zdražila a psychicky mě to deptá',
      'Celý týden mi nešlo nic, karma za co já nevím',
      'Lidi v práci jsou blbci a to mi vzalo soustředění',
      'Dostal jsem špatnou ruku, mulligan, zase špatnou ruku, prdel',
      'Soupeř hrál Planeshift karty co jsem v životě neviděl',
      'ČNB zvýšila sazby a to se na mě psychicky podepsalo',
      'Prohrál jsem roll, prohrál jsem Game 1, to nastaví tempo na celý zápas',
      'Byl jsem hladový a hloupý rozhoduji se hladový',
      'Soupeř hrál 4 hodiny a já jsem byl unavenej z čekání',
      'Počasí bylo hnusný a to mi bere životní energii',
      'Měl jsem kombinaci karet co spolu nefungovaly, to je design chyba',
      'Soupeř si dal kafé, já ne, výhoda stimulantů je reálná',
      'Internet byl pomalý a nemohl jsem si dohledat ruling',
      'Přišel jsem pozdě kvůli tramvaji a byl jsem nervózní',
      'Neudělal jsem správný rituál míchání, příště 7× a cut',
      'Všichni kolem mě vyhráli takže jsem musel prohrát já',
      'Karta co jsem potřeboval stojí 4000 Kč, to je systémový problém',
      'Soupeř si přinesl vlastní kostky a to je podezřelé',
    ];

    const PALETTE = [
      '#8b1a1a','#a03030','#b84040','#7a2020','#c05050',
      '#6a1010','#d06060','#902828','#b03838','#803030',
      '#c04848','#7c1c1c','#a82c2c','#b84848','#943535',
    ];

    const canvas  = document.getElementById('wheel');
    const ctx     = canvas.getContext('2d');
    const SIZE    = 660;
    const CENTER  = SIZE / 2;
    const RADIUS  = CENTER - 16;
    const N       = REASONS.length;
    const SLICE   = (2 * Math.PI) / N;

    let currentAngle = -Math.PI / 2;
    let spinning     = false;

    function drawWheel(rotation) {
      ctx.clearRect(0, 0, SIZE, SIZE);

      ctx.save();
      ctx.shadowColor = '#f04f5e33';
      ctx.shadowBlur  = 30;
      ctx.beginPath();
      ctx.arc(CENTER, CENTER, RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = '#18182a';
      ctx.fill();
      ctx.restore();

      for (let i = 0; i < N; i++) {
        const startAngle = rotation + i * SLICE;
        const endAngle   = startAngle + SLICE;

        ctx.beginPath();
        ctx.moveTo(CENTER, CENTER);
        ctx.arc(CENTER, CENTER, RADIUS, startAngle, endAngle);
        ctx.closePath();
        ctx.fillStyle = PALETTE[i % PALETTE.length];
        ctx.fill();
        ctx.strokeStyle = '#0f0f17';
        ctx.lineWidth   = 1;
        ctx.stroke();

        ctx.save();
        ctx.translate(CENTER, CENTER);
        ctx.rotate(startAngle + SLICE / 2);
        ctx.textAlign    = 'right';
        ctx.textBaseline = 'middle';
        ctx.fillStyle    = 'rgba(255,220,220,0.95)';
        ctx.font         = 'bold 9.5px Segoe UI, system-ui, sans-serif';
        ctx.fillText(REASONS[i], RADIUS - 8, 0);
        ctx.restore();
      }

      ctx.beginPath();
      ctx.arc(CENTER, CENTER, 22, 0, Math.PI * 2);
      ctx.fillStyle = '#0f0f17';
      ctx.fill();
      ctx.strokeStyle = '#f04f5e';
      ctx.lineWidth   = 2;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(CENTER, CENTER, 7, 0, Math.PI * 2);
      ctx.fillStyle = '#f04f5e';
      ctx.fill();
    }

    function getWinner(angle) {
      const adjusted = ((-Math.PI / 2 - angle) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
      return Math.floor(adjusted / SLICE) % N;
    }

    function showWinner(text) {
      document.getElementById('result-label').textContent = 'Prohrál jsi protože...';
      const el = document.getElementById('result-winner');
      el.textContent = text;
      el.classList.remove('show');
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
    }

    function easeOut(t) { return 1 - Math.pow(1 - t, 4); }

    document.getElementById('spin').addEventListener('click', () => {
      if (spinning) return;
      spinning = true;
      document.getElementById('spin').disabled = true;
      document.getElementById('result-label').textContent = '';
      document.getElementById('result-winner').classList.remove('show');

      const spinAmount = (6 + Math.random() * 4) * 2 * Math.PI;
      const duration   = 7000;
      const startTime  = performance.now();
      const startAngle = currentAngle;

      function animate(now) {
        const elapsed = now - startTime;
        const t       = Math.min(elapsed / duration, 1);
        currentAngle  = startAngle + spinAmount * easeOut(t);
        drawWheel(currentAngle);

        if (t < 1) {
          requestAnimationFrame(animate);
        } else {
          spinning = false;
          document.getElementById('spin').disabled = false;
          showWinner(REASONS[getWinner(currentAngle)]);
        }
      }

      requestAnimationFrame(animate);
    });

    drawWheel(currentAngle);
  </script>
</body>
</html>
